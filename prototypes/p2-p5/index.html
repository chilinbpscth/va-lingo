<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藝言堂｜小二・小五評賞預覽</title>
<style>
:root{--ink:#163c3a;--green:#166b62;--line:#d8e3dc;--cream:#f7f6ef}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.7 system-ui,sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:22px max(24px,calc((100vw - 1180px)/2))}h1{font-size:27px;margin:0}h2{font-size:26px;margin:0 0 12px}h3{font-size:19px;margin:18px 0 8px}p{margin:8px 0}.eyebrow{font-size:13px;letter-spacing:2px;color:#53796f}.notice{background:#fff1cc;padding:8px 24px;text-align:center;font-size:14px}.wrap{max-width:1180px;margin:auto;padding:24px}.entry{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:22px}label{display:block;font-weight:600}select,input,textarea,button{font:inherit}select,input,textarea{border:1px solid #96aea4;border-radius:12px;padding:10px;background:white;color:var(--ink)}select{min-width:130px}button{cursor:pointer;border:1px solid #a0b7ac;background:white;color:var(--ink);border-radius:14px;padding:10px 18px;min-height:48px}button:hover{background:#edf5ef}.primary:hover,button[aria-pressed=true]:hover{background:#12594f;color:white}button[aria-pressed=true],.primary{background:var(--green);color:white;border-color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid #d58736;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:26px}.card{background:white;padding:24px;border:1px solid var(--line);border-radius:24px}.art{position:relative;width:fit-content;max-width:100%;margin:auto;line-height:0}.art img{display:block;max-width:100%;max-height:520px;width:auto;height:auto;cursor:crosshair}.pin{position:absolute;transform:translate(-50%,-50%);border:3px solid white;box-shadow:0 0 0 2px #135e56;border-radius:50%;width:25px;height:25px;background:#166b62;pointer-events:none}.small{font-size:14px;color:#536a60}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.steps button{font-size:15px;padding:8px 12px}.choices{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.choices button{min-width:88px}.field{width:100%;margin-top:8px}textarea{min-height:96px;resize:vertical}.foot{display:flex;gap:10px;justify-content:space-between;margin-top:22px}.summary{white-space:pre-wrap;background:#eff5ee;padding:18px;border-radius:15px}.muted{color:#596c63}a{color:#17685d}details{margin-top:18px}summary{cursor:pointer}#status{min-height:25px;font-size:14px}.badge{display:inline-block;border-radius:20px;background:#e8f1ec;padding:3px 12px;font-size:14px}#lesson{margin-bottom:18px} @media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:15px}.card{padding:18px}.art img{max-height:380px}h2{font-size:23px}.entry{gap:10px}.entry label{flex:1}select{width:100%}}
</style>
<div class="notice">設計預覽・合成班別／學號・只儲存於本機，未連接學校名冊或提交系統</div>
<header><div class="eyebrow">藝言堂 · 看見、感受、說出來</div><h1>每個人都可以有不同感受</h1></header>
<main class="wrap"><div class="entry"><label>試看年級<select id="grade"><option value="p2">小二</option><option value="p5">小五</option></select></label><label>班別（示例）<select id="class"><option>2A</option></select></label><label>學號（示例）<select id="student"><option>01</option><option>02</option></select></label><button id="start" class="primary">開始評賞</button></div>
<div id="lesson"></div><div class="grid"><section class="card"><span class="badge">名作欣賞</span><h2 id="worktitle"></h2><div class="art" id="art"><img id="artimage" alt=""><span class="pin" id="pin" hidden></span></div><p class="small">可以點作品標記一處，也可以揀「整件作品」。標記唔係必做。</p><div class="choices"><button id="whole">整件作品</button><button id="clearpoint">取消位置</button></div><label class="small">想用文字指出位置？<input id="location" class="field" placeholder="例如：人物的嘴角／天空的雲"></label><p id="credit" class="small"></p><details><summary>作品資料及來源</summary><div id="sources" class="small"></div></details></section>
<section class="card"><nav class="steps" aria-label="評賞五步"></nav><h2 id="question"></h2><p id="intro" class="muted"></p><div id="form"></div><div id="status" role="status" aria-live="polite"></div><div class="foot"><button id="prev">上一步</button><button id="next" class="primary">下一步</button></div><details><summary>老師參考：睇到甚麼能力？</summary><p id="teacher" class="small"></p><p class="small">完成記錄只反映有冇回應，唔代表答得好或差。口頭回應由老師確認；唔按字數、詞深或感受種類評分。</p></details></section></div></main>
<script>
const $=id=>document.getElementById(id);
const configs={p2:{classId:'2A',topic:'百變蒙羅麗莎（拼貼）',title:'蒙羅麗莎',artist:'達文西',image:'assets/mona-lisa.jpg',credit:'羅浮宮藏品；Wikimedia Commons 公有領域數碼複製圖（修整版本）',source:'https://collections.louvre.fr/ark:/53355/cl010062370',imageSource:'https://commons.wikimedia.org/wiki/File:Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg',note:'先觀察肖像，再試改變表情或背景作拼貼。作品令人有甚麼感覺，由你自己決定。'},p5:{classId:'5A',topic:'梵高的流動線條（世界名勝）',title:'有柏樹的麥田',artist:'文森・梵高，1889',image:'assets/wheat-field.jpg',credit:'The Metropolitan Museum of Art，1993.132；Public Domain',source:'https://www.metmuseum.org/art/collection/search/436535',imageSource:'https://www.metmuseum.org/art/collection/search/436535',note:'用來觀察線條及筆觸的教學參考作品；不是把畫中地點當成指定世界名勝。'}};
const names=['整體感受','仔細觀察','視覺效果','我的理解','評賞回應'];let grade='p2',step=0,active=false,d={};
const empty=()=>({feelings:[],reason:'',location:'',point:null,whole:false,responses:['','','',''],hint:false});
function key(){return 'va-preview-p2p5-v1:'+grade+':'+$('class').value+':'+$('student').value}
function save(){try{localStorage.setItem(key(),JSON.stringify(d));$('status').textContent='已儲存於這部裝置（預覽）'}catch(e){$('status').textContent='無法儲存，請先保留此頁。'}}
function load(){d=empty();try{const x=JSON.parse(localStorage.getItem(key())||'null');if(x&&Array.isArray(x.feelings)&&Array.isArray(x.responses))d={...d,...x}}catch(e){}step=0;render()}
function point(){const p=$('pin');p.hidden=!d.point;if(d.point){p.style.left=d.point.x+'%';p.style.top=d.point.y+'%'}$('whole').setAttribute('aria-pressed',String(d.whole));$('location').value=d.location||''}
function abilities(){const observed=!!(d.point||d.whole||d.location.trim());$('teacher').textContent=grade==='p2'?'小二：辨認並表達感受；能指出所見屬延伸表現。可由口頭、點選或文字表達。':'小五：表達感受，選擇所見作依據，再解釋兩者關係。正式視藝詞彙不是本步的先決條件。';$('teacher').textContent+=' 目前：'+(d.feelings.length?'已有感受選擇':'未選感受')+'；'+(observed?'已有觀察位置／範圍':'未指出範圍')+'；'+(d.reason.trim()?'有文字說明（內容待老師判讀）':'未有文字說明')}
function render(){const c=configs[grade];$('lesson').textContent=c.classId+' · 第一學段 · '+c.topic+'（本預覽示範自動進入唯一課題，毋須輸入課堂碼）';$('worktitle').textContent=c.title;$('artimage').src=c.image;$('artimage').alt=c.artist+'《'+c.title+'》';$('credit').textContent=c.artist+'｜'+c.credit;$('sources').replaceChildren();const note=document.createElement('p');note.textContent=c.note;$('sources').append(note);for(const [text,url] of [['館藏資料',c.source],['圖片及使用標示',c.imageSource]]){const a=document.createElement('a');a.textContent=text+' ↗ ';a.href=url;a.target='_blank';a.rel='noopener';$('sources').append(a)}
const nav=document.querySelector('.steps');nav.replaceChildren();names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+n;b.setAttribute('aria-pressed',String(step===i));b.onclick=()=>{step=i;renderForm()};nav.append(b)});point();renderForm()}
function renderForm(){document.querySelectorAll('.steps button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===step)));$('form').replaceChildren();$('prev').disabled=step===0;$('next').textContent=step===4?'看看我的評賞':'下一步';$('status').textContent=active?'已選示例身分，回應只留在本機。':'可先試用；按「開始評賞」選用示例身分。';
const titles=grade==='p2'?['第一眼，你有甚麼感覺？','你看見甚麼？','這件作品用了甚麼方法？','它令你想到甚麼？','你想說甚麼？']:['第一眼，你感受到甚麼？','哪些細節值得留意？','甚麼安排產生這個效果？','你怎樣理解這件作品？','你如何評價這件作品？'];$('question').textContent=titles[step];
const intros=grade==='p2'?['揀一個就可以。感受沒有標準答案。','說一樣你真的看見的東西，不用猜作者心情。','揀一種顏色、線條或形狀，說說它的樣子。','可以聯想到生活或故事；唔肯定也可以說。','說出你留意或欣賞的一點。']:['最多揀兩個，再簡單說明原因；不需要寫長文。','先描述所見，把觀察與猜想分開。','選一項顏色、線條或安排，說明它帶來甚麼效果。','提出一個可能的意思，連到作品所見；不猜作者的唯一答案。','用作品中的特徵支持你的評價，改善建議可選填。'];$('intro').textContent=intros[step];
if(step===0){const choices=document.createElement('div');choices.className='choices';[...new Set(['平靜','開心','緊張','驚訝','好奇','難過','未有特別感覺',...d.feelings])].forEach(word=>{const b=document.createElement('button');b.textContent=word;b.setAttribute('aria-pressed',String(d.feelings.includes(word)));b.onclick=()=>{if(d.feelings.includes(word))d.feelings=d.feelings.filter(w=>w!==word);else if(grade==='p2')d.feelings=[word];else if(d.feelings.length<2)d.feelings.push(word);else{$('status').textContent='可先取消一個，再揀新的感受。';return}save();renderForm()};choices.append(b)});$('form').append(choices);
const custom=document.createElement('input');custom.className='field';custom.placeholder='自己的感受詞';custom.setAttribute('aria-label','自己的感受詞');const add=document.createElement('button');add.textContent='用自己的詞';add.onclick=()=>{const v=custom.value.trim();if(!v)return;if(grade==='p2')d.feelings=[v];else if(!d.feelings.includes(v)&&d.feelings.length<2)d.feelings.push(v);else{$('status').textContent='已選兩個，請先取消其中一個。';return}save();renderForm()};$('form').append(custom,add);const chosen=document.createElement('p');chosen.textContent='我的選擇：'+(d.feelings.join('、')||'未選');$('form').append(chosen);
const label=document.createElement('label');label.textContent=grade==='p2'?'想多說一點？（可留空，亦可向老師口述）':'甚麼令你有這個感覺？（一句短句就可以）';const ta=document.createElement('textarea');ta.className='field';ta.value=d.reason;ta.placeholder=grade==='p2'?'我看見……':'我留意到……，令我覺得……';ta.oninput=()=>{d.reason=ta.value;save();abilities()};label.append(ta);$('form').append(label);const help=document.createElement('details');help.innerHTML='<summary>給我一點提示</summary><p>先看一看整件作品，再留意一處。你可以說：我見到＿＿，所以感到＿＿。唔一定要用深詞。</p>';$('form').append(help)
}else{const label=document.createElement('label');label.textContent='我的回應';const ta=document.createElement('textarea');ta.className='field';ta.value=d.responses[step-1]||'';ta.placeholder=grade==='p2'?'可用短詞，也可以先向老師說一說。':'用短句說出你的觀察或想法。';ta.oninput=()=>{d.responses[step-1]=ta.value;save()};label.append(ta);$('form').append(label)}abilities()}
$('grade').onchange=()=>{grade=$('grade').value;$('class').replaceChildren(new Option(configs[grade].classId,configs[grade].classId));active=false;load()};$('student').onchange=()=>{active=false;load()};$('start').onclick=()=>{active=true;load();$('status').textContent='已進入本班示例課題；毋須填課堂碼。'};$('artimage').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();d.point={x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};d.whole=false;point();save();abilities()};$('whole').onclick=()=>{d.whole=true;d.point=null;point();save();abilities()};$('clearpoint').onclick=()=>{d.whole=false;d.point=null;point();save();abilities()};$('location').oninput=()=>{d.location=$('location').value;save();abilities()};$('prev').onclick=()=>{step=Math.max(0,step-1);renderForm()};$('next').onclick=()=>{if(step===0&&(!d.feelings.length||(grade==='p5'&&!d.reason.trim()))){$('status').textContent=grade==='p2'?'請先揀一個感受。':'請揀感受，再簡單說明原因；不用為了填字而寫長句。';return}if(step<4){step++;renderForm();return}const s=document.createElement('div');s.className='summary';s.textContent='我的感受：'+d.feelings.join('、')+'\n'+(d.reason||'未加文字說明')+'\n\n'+d.responses.map((r,i)=>names[i+1]+'：'+(r||'未填／可口頭回應')).join('\n');$('form').replaceChildren(s);save();$('status').textContent='這是回顧，未提交到學校。'};load();
</script></html>
