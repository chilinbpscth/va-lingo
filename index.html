<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VA-Lingo 藝言堂 — 觀我香港：熱鬧的香港</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            va: {
              blue: '#e8437a',
              gold: '#ff6b9d',
              light: '#ffe3ef',
              muted: '#7a6a8a',
              purple: '#5b3a8c',
              soft: '#ffe3ef',
              text: '#3b2a55',
              line: '#ffd6e8',
              bg: '#fff7fb',
              ok: '#1abc9c'
            }
          },
          minHeight: { touch: '44px' },
          minWidth: { touch: '44px' },
          borderRadius: { card: '22px' },
          boxShadow: { soft: '0 12px 28px rgba(255, 107, 157, .16)' }
        }
      }
    };
  </script>
  <style>
    :root {
      --accent: #ff6b9d;
      --accent-dark: #e8437a;
      --purple: #5b3a8c;
      --soft: #ffe3ef;
      --text: #3b2a55;
      --muted: #7a6a8a;
      --line: #ffd6e8;
      --bg: #fff7fb;
      --radius: 22px;
      --shadow: 0 12px 28px rgba(255, 107, 157, .16);
      --ok: #1abc9c;
      --va-blue: #e8437a;
      --va-gold: #ff6b9d;
      --app-header-h: 72px;
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .comic {
      font-family: "Noto Sans TC", "PingFang HK", "Hiragino Sans GB", "Microsoft JhengHei", system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    body {
      font-family: "Noto Sans TC", "PingFang HK", "Hiragino Sans GB", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      letter-spacing: 0;
    }
    .chip, .btn-pill, .step-btn, .source-tab, label, button, select, input, textarea {
      font-family: inherit;
      letter-spacing: 0.01em;
    }
    .scene-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background:
        radial-gradient(ellipse 60% 40% at 10% 0%, #ffe8f3 0%, transparent 60%),
        radial-gradient(ellipse 50% 35% at 90% 8%, #fff0d6 0%, transparent 55%),
        radial-gradient(ellipse 40% 30% at 80% 90%, #e8f0ff 0%, transparent 50%),
        var(--bg);
    }
    .scene-bg svg { position: absolute; width: 100%; height: 100%; }
    .app-shell { position: relative; z-index: 1; }
    .card-surface {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .btn-pill {
      border-radius: 999px !important;
      min-height: 44px;
      font-weight: 700;
    }
    .btn-primary {
      background: linear-gradient(90deg, #ff6b9d, #ff8e53);
      color: #fff !important;
      box-shadow: 0 3px 0 #ffd36b;
      border: 0 !important;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:disabled { opacity: .4; filter: none; box-shadow: none; }
    .btn-ghost {
      background: #fff;
      color: var(--accent-dark);
      border: 1.5px solid var(--line);
      box-shadow: 0 2px 0 #ffe3ef;
    }
    .pin {
      width: 28px; height: 28px; border-radius: 50% 50% 50% 0;
      background: #ff6b9d; color: #fff; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      transform: rotate(-45deg); cursor: pointer; border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(255,107,157,.45); z-index: 10;
      min-width: 28px; min-height: 28px;
    }
    .pin span { transform: rotate(45deg); }
    .pin:hover, .pin.active { background: #ff8e53; transform: rotate(-45deg) scale(1.15); }
    .chip {
      min-height: 44px; padding: 0.5rem 0.95rem; border-radius: 9999px;
      border: 1.5px solid var(--line); background: #fff7fb; color: var(--text);
      font-size: 0.875rem; cursor: grab; transition: all .15s; white-space: nowrap;
      box-shadow: 0 2px 0 #ffe3ef;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .chip:hover, .chip:focus {
      border-color: var(--accent); background: #fff0f6;
      box-shadow: 0 3px 0 #ffd36b;
    }
    .chip.used { opacity: .55; border-style: dashed; box-shadow: none; cursor: grab; }
    .chip.dragging { opacity: .35; }
    .chip.selected, .chip.on {
      background: linear-gradient(90deg, #ff6b9d, #ff8e53);
      color: #fff; border-color: transparent; box-shadow: 0 3px 0 #ffd36b;
    }
    .chip-ghost {
      position: fixed; z-index: 250; pointer-events: none;
      min-height: 44px; padding: 0.5rem 0.95rem; border-radius: 9999px;
      border: 1.5px solid var(--accent); background: #fff0f6; color: var(--text);
      font-size: 0.875rem; white-space: nowrap; font-weight: 600;
      box-shadow: 0 8px 20px rgba(255,107,157,.35), 0 3px 0 #ffd36b;
      transform: translate(-50%, -50%) scale(1.06);
      opacity: .95;
    }
    .scaffold-blank.drag-over {
      background: #ffe3ef !important;
      box-shadow: 0 0 0 3px rgba(255,107,157,.35);
    }
    .step-btn {
      min-height: 44px; min-width: 44px;
      border-radius: 999px !important;
      border: 1.5px solid var(--line) !important;
      background: #fff;
      color: var(--muted);
      box-shadow: 0 2px 0 #ffe3ef;
    }
    .step-btn.active {
      background: linear-gradient(90deg, #ff6b9d, #ff8e53) !important;
      color: #fff !important;
      border-color: transparent !important;
      box-shadow: 0 3px 0 #ffd36b;
    }
    .step-btn.done {
      background: #e8faf6 !important;
      color: #0e8c74 !important;
      border-color: #1abc9c !important;
      box-shadow: 0 2px 0 #a8e6d8;
    }
    .scaffold-blank {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 4.5rem; min-height: 44px; vertical-align: middle;
      border-bottom: 2px dashed var(--accent-dark);
      padding: 0 .35rem; margin: 0 .15rem; color: var(--accent-dark); font-weight: 600;
      cursor: text; outline: none; background: var(--soft); border-radius: 6px 6px 0 0;
      transition: background .15s, box-shadow .15s;
    }
    .scaffold-blank:empty::before { content: '_____'; color: #c4a8b8; font-weight: 400; }
    .scaffold-blank.filled {
      display: inline-flex; align-items: center; gap: .2rem;
      min-height: 44px; padding: .2rem .35rem .2rem .75rem;
      border: 1.5px solid var(--accent); border-bottom: 1.5px solid var(--accent);
      border-radius: 9999px; background: #fff0f6; color: var(--accent-dark);
      cursor: default; box-shadow: 0 2px 0 #ffe3ef;
    }
    .scaffold-blank.filled:empty::before { content: none; }
    .blank-clear {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 32px; min-height: 32px; margin-left: .1rem;
      border: none; border-radius: 9999px; background: #ffd6e7; color: #c2185b;
      font-size: 1.1rem; line-height: 1; cursor: pointer; font-weight: 700;
      padding: 0;
    }
    .blank-clear:hover, .blank-clear:focus { background: #ff6b9d; color: #fff; }
    .mood-btn {
      min-width: 56px; min-height: 56px; font-size: 1.75rem;
      border-radius: 1rem; border: 1.5px solid var(--line); background: #fff;
      box-shadow: 0 2px 0 #ffe3ef;
    }
    .mood-btn.selected {
      border-color: var(--accent);
      background: #fff0f6;
      box-shadow: 0 0 0 3px rgba(255,107,157,.28), 0 3px 0 #ffd36b;
    }
    .ks1-control .chip, .ks1-control button, .ks1-control input, .ks1-control textarea {
      font-size: 1.05rem; min-height: 48px;
    }
    #canvas-stage {
      position: relative;
      user-select: none;
      /* Stabilize photo area so capture / preview load does not resize the column */
      height: min(40vh, 320px);
      min-height: 200px;
      max-height: 40vh;
    }
    @supports (height: 100dvh) {
      #canvas-stage { height: min(40dvh, 320px); max-height: 40dvh; }
    }
    .toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      background: linear-gradient(90deg, #ff6b9d, #ff8e53); color: #fff;
      padding: .65rem 1.25rem; border-radius: 9999px;
      z-index: 100; opacity: 0; transition: opacity .25s; pointer-events: none;
      box-shadow: 0 3px 0 #ffd36b, var(--shadow);
      font-weight: 700;
      max-width: min(92vw, 28rem); text-align: center; line-height: 1.35;
    }
    .toast.show { opacity: 1; }
    .toast.show.toast-interactive { pointer-events: auto; border-radius: 1rem; }
    .toast a { color: #fff; text-decoration: underline; font-weight: 800; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(59,42,85,.45); z-index: 80;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .rubric-item { min-height: 44px; border-color: var(--line) !important; }
    @media print {
      @page { size: A4; margin: 14mm; }
      body * { visibility: hidden !important; }
      #print-card, #print-card * { visibility: visible !important; }
      #print-card {
        position: absolute; left: 0; top: 0; width: 100%;
        background: #fff; color: #000; padding: 0;
      }
      .no-print, .scene-bg { display: none !important; }
    }
    #print-card { display: none; }
    @media print { #print-card { display: block !important; } }
    .tab-active {
      border-bottom: 3px solid var(--accent) !important;
      color: var(--accent-dark) !important;
      font-weight: 700;
    }
    .src-card {
      border: 1.5px solid var(--line); border-radius: 18px; cursor: pointer; transition: all .15s;
      background: #fff;
    }
    .src-card:hover, .src-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,107,157,.2), 0 3px 0 #ffd36b;
    }
    textarea:focus, input:focus, select:focus {
      outline: 2px solid var(--accent); outline-offset: 1px;
    }
    .title-bubble {
      color: var(--accent-dark);
      text-shadow: 0 3px 0 #ffd36b;
      font-family: "Noto Sans TC", "PingFang HK", "Hiragino Sans GB", "Microsoft JhengHei", system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .mode-bar {
      background: rgba(255,255,255,.92);
      border-bottom: 1.5px solid var(--line);
      backdrop-filter: blur(8px);
      /* Matches measured sticky header; fallback 72px for desktop single-row */
      top: var(--app-header-h, 72px) !important;
    }
    header.app-header {
      background: rgba(255,255,255,.95);
      border-bottom: 1.5px solid var(--line);
      box-shadow: 0 8px 20px rgba(255,107,157,.1);
      backdrop-filter: blur(10px);
    }
    .logo-badge {
      background: linear-gradient(135deg, #ff6b9d, #ff8e53);
      color: #fff;
      box-shadow: 0 3px 0 #ffd36b;
    }
    .seg-toggle {
      border-radius: 999px;
      overflow: hidden;
      border: 1.5px solid var(--line);
      background: #fff;
    }
    .seg-toggle .ks-toggle,
    .seg-toggle .level-toggle {
      border-radius: 0;
    }
    /* Mobile / tablet (< lg): denser padding, usable steps + sticky nav */
    @media (max-width: 1023px) {
      .app-shell .max-w-7xl { padding-left: 0.65rem; padding-right: 0.65rem; }
      header.app-header .max-w-7xl { padding-top: 0.4rem; padding-bottom: 0.4rem; }
      header.app-header .logo-badge { width: 2rem !important; height: 2rem !important; font-size: 0.85rem; }
      header.app-header #app-title { font-size: 1rem; line-height: 1.2; }
      header.app-header .header-subtitle { font-size: 0.65rem; line-height: 1.2; }
      header.app-header .flex.flex-wrap.items-center.justify-between { gap: 0.4rem; }
      .mode-bar .max-w-7xl { padding-top: 0.35rem; padding-bottom: 0.35rem; gap: 0.4rem; }
      .mode-bar .ks-toggle,
      .mode-bar .level-toggle {
        padding-left: 0.55rem;
        padding-right: 0.55rem;
        font-size: 0.75rem;
        min-height: 40px;
      }
      #canvas-stage {
        height: min(40dvh, 320px);
        max-height: 40dvh;
      }
      /* Wrap step buttons so none are clipped on ~390px; still scroll if needed */
      #step-panel .step-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        overflow-x: visible;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: none;
        padding-bottom: 0.15rem;
        margin-inline: 0;
        padding-inline: 0;
      }
      #step-panel .step-nav .step-btn {
        flex: 1 1 calc(33.333% - 0.35rem);
        min-width: 5.5rem;
        max-width: 100%;
        scroll-snap-align: unset;
        min-height: 40px;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
        font-size: 0.75rem;
        white-space: nowrap;
      }
      #step-nav-actions {
        position: sticky;
        bottom: 0;
        z-index: 5;
        background: linear-gradient(to top, #fff7fb 70%, rgba(255,247,251,0.85));
        padding-top: 0.5rem;
        padding-bottom: 0.35rem;
        margin-top: auto;
        transition: opacity .15s, transform .15s;
      }
      /* Hide sticky bottom actions while typing so keyboard does not fight chrome */
      body.va-field-focused #step-nav-actions {
        position: static;
        opacity: 0;
        pointer-events: none;
        height: 0;
        padding: 0;
        margin: 0;
        overflow: hidden;
      }
      .header-fields {
        width: 100%;
        gap: 0.35rem !important;
      }
      /* Compact 2-col identity row instead of full-width stack (~330px) */
      .header-fields > label {
        flex: 1 1 calc(50% - 0.35rem);
        min-width: 0;
        font-size: 0.75rem;
        gap: 0.35rem;
      }
      .header-fields > label > span.shrink-0 {
        font-size: 0.7rem;
      }
      .header-fields select,
      .header-fields #field-student-id-display {
        width: 100%;
        min-width: 0 !important;
        min-height: 36px;
        padding-top: 0.35rem;
        padding-bottom: 0.35rem;
        font-size: 0.75rem;
      }
      .header-fields > .btn-pill {
        flex: 1 1 calc(50% - 0.35rem);
        min-height: 36px;
        padding: 0.35rem 0.65rem;
        font-size: 0.7rem;
      }
      .header-fields > #btn-cloud-settings {
        flex: 0 0 auto;
        min-width: 0;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }
      .header-fields > #roster-load-note {
        flex: 1 1 100%;
      }
    }
    /* Phone-narrow: even tighter title row */
    @media (max-width: 430px) {
      header.app-header .max-w-7xl { padding-top: 0.3rem; padding-bottom: 0.3rem; }
      header.app-header #app-title { font-size: 0.95rem; }
      #step-panel .step-nav .step-btn {
        flex: 1 1 calc(50% - 0.35rem);
        font-size: 0.72rem;
        min-height: 38px;
      }
    }
    @media (min-width: 1024px) {
      #canvas-stage { max-height: none; }
    }

    /* Classroom live gallery */
    .gallery-bar {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 2px 0 #ffe3ef;
    }
    .gallery-thumb {
      border: 1.5px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff7fb;
      text-align: left;
      min-height: 44px;
      transition: box-shadow .15s, border-color .15s;
    }
    .gallery-thumb:hover, .gallery-thumb.selected {
      border-color: var(--accent);
      box-shadow: 0 3px 0 #ffd36b;
    }
    .gallery-thumb.selected { background: #fff0f6; }
    .gallery-thumb img {
      width: 100%; height: 4.5rem; object-fit: cover; display: block; background: #ffe3ef;
    }
    #gallery-lightbox {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(59, 42, 85, .72);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    #gallery-lightbox.hidden { display: none; }
    #gallery-lightbox .lb-card {
      background: #fff; border-radius: 22px; max-width: min(920px, 100%);
      max-height: 90vh; overflow: auto; border: 1.5px solid var(--line);
      box-shadow: var(--shadow); padding: 0.75rem;
    }
    #gallery-lightbox img { max-width: 100%; max-height: 70vh; object-fit: contain; display: block; margin: 0 auto; border-radius: 14px; }
  </style>

</head>

  <div class="app-shell">

  <!-- Header -->
  <header class="app-header no-print sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-11 h-11 rounded-full logo-badge flex items-center justify-center font-bold shrink-0 text-lg comic">藝</div>
          <div class="min-w-0">
            <h1 id="app-title" class="text-xl sm:text-2xl font-bold leading-tight truncate title-bubble select-none" title="長按可開啟雲端設定">VA-Lingo 藝言堂</h1>

          </div>
        </div>

          <label class="flex items-center gap-1.5 text-sm text-va-muted w-full sm:w-auto min-w-0">

    function sortClasses(classes) {
      return classes.slice().sort((a, b) => {
        const na = parseInt(a, 10) || 0;
        const nb = parseInt(b, 10) || 0;
        if (na !== nb) return na - nb;
        return String(a).localeCompare(String(b), 'zh-HK');
      });
    }

    function uniqueClasses() {
      return sortClasses([...new Set(rosterStudents.map(s => s.class).filter(Boolean))]);
    }

    function studentsInClass(cls) {
      return rosterStudents

    }

    async function ensurePhotoUnderLimit(dataUrl) {
      let q = 0.7;
      let maxW = 1600;
      let out = await compressDataUrl(dataUrl, maxW, q);
      let guard = 0;
      while (out && out.length > GALLERY_MAX_PHOTO_CHARS && guard < 8) {
        guard++;
        if (q > 0.45) q = Math.round((q - 0.1) * 100) / 100;
        else {
          maxW = Math.max(640, Math.round(maxW * 0.75));
          q = 0.65;
        }
        out = await compressDataUrl(dataUrl, maxW, q);
      }
      return out;
    }

          fbMods = {
            collection: fsMod.collection,

            onSnapshot: fsMod.onSnapshot,
            query: fsMod.query,
            orderBy: fsMod.orderBy,
            serverTimestamp: fsMod.serverTimestamp,

          if (!fbAuth.currentUser) {

    function renderLiveGalleryIfNeeded() {
      // Peer picker re-render when on peer tab — preserve scroll (iOS jumps on DOM replace)
      if (state.source !== 'peer') return;
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const vv = window.visualViewport;
      const offsetTop = vv ? vv.offsetTop : 0;
      renderSourcePicker();
      // Restore after images/layout; double-rAF covers iOS keyboard/viewport settle
      requestAnimationFrame(() => {
        window.scrollTo(0, y + offsetTop);
        requestAnimationFrame(() => window.scrollTo(0, y));
      });
    }

    function startGalleryListener(code) {
      stopGalleryListener();
      galleryWorks = [];
      if (!fbReady || !fbDb || !fbMods || !code) {
        renderLiveGalleryIfNeeded();
        return;
      }
      const worksRef = fbMods.collection(fbDb, 'sessions', code, 'works');
      const q = fbMods.query(worksRef, fbMods.orderBy('createdAt', 'desc'));
      galleryUnsub = fbMods.onSnapshot(q, (snap) => {
        galleryWorks = snap.docs.map(d => {
          const data = d.data() || {};
          return Object.assign({ id: d.id }, data);
        });
        setGalleryStatus('課堂 ' + code + ' · ' + galleryWorks.length + ' 件作品（即時）');
        renderLiveGalleryIfNeeded();

        console.warn('[va-lingo] gallery snapshot error', err);

        return;

      setGalleryStatus('加入中…');
      const ok = await initFirebaseOnce();
      if (!ok || !fbAuth || !fbAuth.currentUser) {
        toast('無法連接畫廊，請檢查網絡後再試');
        setGalleryStatus(gallerySession
          ? ('課堂 ' + gallerySession + ' · ' + galleryWorks.length + ' 件作品')
          : '尚未加入課堂');
        return;
      }
      try {
        // Touch session doc so teachers can see active codes (rules: create/update if authed)
        const sessionRef = fbMods.doc(fbDb, 'sessions', code);
        await fbMods.setDoc(sessionRef, {
          classId: code,
          updatedAt: fbMods.serverTimestamp(),
          joinedBy: fbAuth.currentUser.uid
        }, { merge: true });
        gallerySession = code;
        localStorage.setItem(GALLERY_SESSION_KEY, code);

          answers: p.answers || {},
          moods: p.moods || {},
          rubrics: p.rubrics || {},
          usedChips: p.usedChips || {}
        });
      } catch (e) { /* ignore */ }
    }

    const MASTER_ART_SRC = 'assets/fufeng-fucheng.jpg';

    function masterArtworkHtml(compact) {
      const thumbCls = compact ? 'w-full h-full object-contain' : 'absolute inset-0 w-full h-full object-contain';
      const wrapCls = compact
        ? 'relative w-full h-full bg-[#fff0f6] overflow-hidden'
        : 'relative w-full h-full bg-[#fff0f6]';
      // Image hook ready for later download; onerror keeps 示範圖像 SVG visible.
      return `<div class="${wrapCls}" data-master-art="1">
  <img id="master-art" src="${MASTER_ART_SRC}" alt="樊楓《俯城之五》" class="${thumbCls} z-[1]"
    style="object-fit:contain;"
    onload="this.dataset.loaded='1'; var fb=this.parentElement.querySelector('[data-master-fallback]'); if(fb) fb.style.display='none'; var lb=this.parentElement.querySelector('[data-demo-label]'); if(lb) lb.style.display='none';"
    onerror="this.style.display='none'; var fb=this.parentElement.querySelector('[data-master-fallback]'); if(fb) fb.style.display=''; var lb=this.parentElement.querySelector('[data-demo-label]'); if(lb) lb.style.display='';" />
  <div data-master-fallback class="absolute inset-0 w-full h-full">${MASTER_SVG}</div>
  <div data-demo-label class="absolute top-2 left-2 z-[2] pointer-events-none">
    <span class="inline-block rounded-full px-2.5 py-1 text-[11px] font-bold text-white" style="background:linear-gradient(90deg,#ff6b9d,#ff8e53);box-shadow:0 2px 0 #ffd36b;">示範圖像／待載入真跡圖</span>
  </div>
</div>`;
    }

    function currentArtworkHtml() {
      if (state.source === 'master') return masterArtworkHtml(false);
      if (state.source === 'peer') {
        const liveId = liveWorkIdFromPeer(state.selectedPeer);
        if (liveId) {
          const w = findLiveWork(liveId);

          }
          return `<div class="w-full h-full flex items-center justify-center text-va-muted text-sm bg-slate-100">作品載入中或不存在</div>`;
        }
        const peer = PEERS.find(p => p.id === state.selectedPeer) || PEERS[0];
        return peer.svg;
      }
      if (state.selfImage) {
        return `<img src="${state.selfImage}" alt="我的創作" class="w-full h-full object-contain bg-slate-100" />`;
      }
      return `<div class="w-full h-full flex flex-col items-center justify-center text-va-muted gap-2 bg-slate-100">
        <div class="text-4xl">📷</div>
        <p class="text-sm">請上傳或拍攝你的作品</p>
      </div>`;

    function contextHint() {
      if (state.source === 'master') {
        return '📌 文化情境提示：樊楓以<strong>鳥瞰</strong>視角描繪都市，結合<strong>水墨</strong>筆墨層次表現香港的密度與節奏。試從「高處望城」想：你看見怎樣的香港？';

        const liveId = liveWorkIdFromPeer(state.selectedPeer);

          const w = findLiveWork(liveId);
          const who = w ? ((w.displayName || '同學') + (w.classLabel ? '（' + w.classLabel + '）' : '')) : '同學';

        }

        return '🤝 同儕作品：' + peer.hint + ' 請用友善、具體的句子給予回饋。';

    function renderSourcePicker() {
      const box = document.getElementById('source-picker');
      if (state.source === 'master') {
        box.innerHTML = `<div class="src-card selected p-3 flex gap-3 items-center">
          <div class="w-16 h-12 rounded bg-slate-200 overflow-hidden shrink-0">${masterArtworkHtml(true).replace('id="master-art"', 'id="master-art-thumb"').replace('class="w-full h-full"', 'class="w-full h-full" style="pointer-events:none"')}</div>
          <div><div class="font-bold text-va-blue">樊楓《俯城之五》</div><div class="text-xs text-va-muted">大師名作 · 示範圖像（非真跡）· 待放入 assets/fufeng-fucheng.jpg</div></div>
        </div>`;
      } else if (state.source === 'peer') {
        const liveCards = galleryWorks.length
          ? (`<div class="mb-2"><div class="text-xs font-bold text-va-blue mb-1.5">課堂即時作品${gallerySession ? ' · ' + gallerySession : ''}</div>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" style="min-height:${Math.max(120, Math.ceil(galleryWorks.length / 2) * 96)}px">` +
             galleryWorks.map(w => {

               const sub = escapeHtml((w.classLabel || '') + (w.studentId ? ' · ' + w.studentId : ''));
               const src = (w.photoData || '').replace(/"/g, '&quot;');
               return `<button type="button" class="gallery-thumb p-1.5 ${state.selectedPeer === pid ? 'selected' : ''}" data-live-work="${escapeHtml(w.id)}">
                  <img src="${src}" alt="${label}" loading="lazy" />
                  <div class="text-xs font-bold truncate mt-1 px-0.5">${label}</div>
                  <div class="text-[10px] text-va-muted truncate px-0.5">${sub || '點擊放大／互評'}</div>
                </button>`;
             }).join('') + `</div></div>`)
          : (`<div class="mb-2 text-xs text-va-muted rounded-[14px] border border-dashed border-va-line px-3 py-2">${
               gallerySession
                 ? '課堂 ' + escapeHtml(gallerySession) + ' 尚無同學發佈作品。可先用下方示範圖練習互評。'
                 : '輸入課堂碼並按「加入課堂畫廊」，即可看到同學即時作品。'
             }</div>`);
        const demoCards = `<div class="text-xs font-bold text-va-muted mb-1.5">示範同儕（離線）</div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">` + PEERS.map(p => `
          <button type="button" class="src-card p-2 text-left ${state.selectedPeer === p.id ? 'selected' : ''}" data-peer="${p.id}">
            <div class="h-16 rounded overflow-hidden mb-1">${p.svg}</div>
            <div class="text-xs font-bold truncate">${p.title}</div>
            <div class="text-[10px] text-va-muted truncate">${p.name}</div>
          </button>`).join('') + `</div>`;
        box.innerHTML = liveCards + demoCards;
        box.querySelectorAll('[data-peer]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.selectedPeer = btn.getAttribute('data-peer');
            renderAll();
            save();
          });
        });
        box.querySelectorAll('[data-live-work]').forEach(btn => {
          btn.addEventListener('click', () => {
            const wid = btn.getAttribute('data-live-work');
            openGalleryLightbox(wid);
          });
          btn.addEventListener('dblclick', () => {
            const wid = btn.getAttribute('data-live-work');
            selectLiveWorkForPeer(wid);
          });

      } else {
        box.innerHTML = `<div class="flex flex-wrap gap-2 items-center">
          <label class="inline-flex items-center gap-2 btn-pill btn-primary px-4 py-2.5 min-h-touch cursor-pointer text-sm">
            📷 拍攝／上傳作品
            <input id="self-file" type="file" accept="image/*" capture="environment" class="hidden" />
          </label>
          ${state.selfImage ? '<button type="button" id="clear-self" class="btn-pill btn-ghost px-3 py-2 min-h-touch text-sm">清除圖片</button>' : ''}
        </div>`;
        const fi = document.getElementById('self-file');
        if (fi) {
          fi.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              state.selfImage = reader.result;
              const y = window.scrollY || 0;
              renderAll();
              requestAnimationFrame(() => window.scrollTo(0, y));
              save();
              toast('已載入你的作品');
            };
            reader.readAsDataURL(file);
          });
        }
        const clr = document.getElementById('clear-self');
        if (clr) clr.addEventListener('click', () => { state.selfImage = null; renderAll(); save(); });
      }
    }

    function pinScope() {
      return state.source + ':' + (state.source === 'peer' ? state.selectedPeer : 'main');
    }

    function scopedPins() {
      return state.pins.filter(p => p.scope === pinScope());
    }

    function renderCanvas() {
      const stage = document.getElementById('canvas-stage');
      stage.innerHTML = currentArtworkHtml();
      scopedPins().forEach((pin, idx) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'pin absolute' + (state.activePin === pin.id ? ' active' : '');
        el.style.left = pin.x + '%';
        el.style.top = pin.y + '%';
        el.style.transform = 'translate(-50%, -100%) rotate(-45deg)';
        el.innerHTML = '<span>' + (idx + 1) + '</span>';
        el.title = pin.note || '大頭針 ' + (idx + 1);
        el.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openPinPopover(pin, el);
        });
        stage.appendChild(el);
      });
      stage.onclick = (ev) => {
        if (ev.target.closest('.pin')) return;
        const pins = scopedPins();
        if (pins.length >= 6) { toast('最多 6 個大頭針'); return; }
        const rect = stage.getBoundingClientRect();
        const x = ((ev.clientX - rect.left) / rect.width) * 100;
        const y = ((ev.clientY - rect.top) / rect.height) * 100;
        const pin = { id: 'p' + Date.now(), scope: pinScope(), x: Math.max(3, Math.min(97, x)), y: Math.max(5, Math.min(95, y)), note: '' };
        state.pins.push(pin);
        renderCanvas();
        renderPinList();
        openPinPopover(pin, stage.querySelector('.pin.active') || stage.querySelectorAll('.pin')[scopedPins().length - 1]);
        save();
      };
      document.getElementById('context-hint').innerHTML = contextHint();
      renderPinList();
    }

    function renderPinList() {
      const list = document.getElementById('pin-notes-list');
      const pins = scopedPins();
      if (!pins.length) {
        list.innerHTML = '<p class="text-xs text-va-muted">尚未加入大頭針註記。</p>';
        return;
      }
      list.innerHTML = pins.map((p, i) => `
        <div class="flex gap-2 items-start bg-white border border-va-line rounded-[14px] p-2">
          <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-[#ff6b9d] text-white text-xs font-bold shrink-0">${i + 1}</span>
          <span class="flex-1 text-slate-700">${escapeHtml(p.note || '（未寫註記）')}</span>
        </div>`).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    let popoverPin = null;
    function openPinPopover(pin, anchorEl) {
      popoverPin = pin;
      state.activePin = pin.id;
      const pop = document.getElementById('pin-popover');
      document.getElementById('pin-pop-num').textContent = String(scopedPins().findIndex(p => p.id === pin.id) + 1);
      document.getElementById('pin-pop-text').value = pin.note || '';
      pop.classList.remove('hidden');
      const r = (anchorEl || document.getElementById('canvas-stage')).getBoundingClientRect();
      let left = r.left + r.width / 2 - 128;
      let top = r.bottom + 8;
      if (left < 8) left = 8;
      if (left + 256 > window.innerWidth - 8) left = window.innerWidth - 264;
      if (top + 180 > window.innerHeight) top = Math.max(8, r.top - 190);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      renderCanvas();
      const pinTa = document.getElementById('pin-pop-text');
      // Avoid auto-focus on coarse pointers / narrow viewports (iPhone keyboard jump)
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      const narrow = Math.min(window.innerWidth, (window.visualViewport && window.visualViewport.width) || window.innerWidth) < 768;
      if (pinTa && !(coarse || narrow)) pinTa.focus({ preventScroll: true });
    }

    function closePinPopover() {
      document.getElementById('pin-popover').classList.add('hidden');
      state.activePin = null;
      popoverPin = null;
      renderCanvas();
    }

    let chipPointer = null; // { word, btn, startX, startY, dragging, pointerId, ghost }

    function vocabWordList() {
      const v = VOCAB[state.ks];
      return [...(v.elements || []), ...(v.principles || [])];
    }

    function blankPlainText(blank) {
      if (!blank) return '';
      const clone = blank.cloneNode(true);
      clone.querySelectorAll('.blank-clear').forEach(el => el.remove());
      return (clone.textContent || '').trim();
    }

    function clearChipSelection() {
      state.selectedChipWord = null;
      document.querySelectorAll('#chips-elements .chip.selected, #chips-principles .chip.selected')
        .forEach(el => el.classList.remove('selected'));
    }

    function setChipSelection(word, btn) {
      clearChipSelection();
      state.selectedChipWord = word;
      if (btn) btn.classList.add('selected');
    }

    function syncUsedChipsFromBlanks() {
      const key = answerKey('chips');
      const used = {};
      document.querySelectorAll('#step-content .scaffold-blank[data-chip-word]').forEach(b => {
        const w = b.getAttribute('data-chip-word');
        if (w) used[w] = true;
      });
      state.usedChips[key] = used;
    }

    function markWordUsed(word) {
      const key = answerKey('chips');
      state.usedChips[key] = state.usedChips[key] || {};
      state.usedChips[key][word] = true;
    }

    function removeChipGhost() {
      document.querySelectorAll('.chip-ghost').forEach(g => g.remove());
      document.querySelectorAll('.scaffold-blank.drag-over').forEach(b => b.classList.remove('drag-over'));
    }

    function blankFromPoint(x, y) {
      const stack = document.elementsFromPoint(x, y);
      for (const el of stack) {
        if (el.classList && el.classList.contains('scaffold-blank')) return el;
        const parent = el.closest && el.closest('.scaffold-blank');
        if (parent) return parent;
      }
      return null;
    }

    function highlightBlankUnder(x, y) {
      document.querySelectorAll('.scaffold-blank.drag-over').forEach(b => b.classList.remove('drag-over'));
      const blank = blankFromPoint(x, y);
      if (blank) blank.classList.add('drag-over');
    }

    function createChipGhost(word, x, y) {
      removeChipGhost();
      const ghost = document.createElement('div');
      ghost.className = 'chip-ghost';
      ghost.textContent = word;
      ghost.style.left = x + 'px';
      ghost.style.top = y + 'px';
      document.body.appendChild(ghost);
      return ghost;
    }

    function setBlankAsChip(blank, word) {
      blank.classList.add('filled');
      blank.setAttribute('data-chip-word', word);
      blank.contentEditable = 'false';
      blank.innerHTML = `${escapeHtml(word)}<button type="button" class="blank-clear" aria-label="清除詞彙">×</button>`;
      const clr = blank.querySelector('.blank-clear');
      if (clr) {
        clr.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          clearScaffoldBlank(blank);
        });
        clr.addEventListener('pointerdown', (e) => e.stopPropagation());
      }
    }

    function resetBlankEditable(blank) {
      blank.classList.remove('filled', 'drag-over');
      blank.removeAttribute('data-chip-word');
      blank.contentEditable = 'true';
      blank.textContent = '';
    }

    function clearScaffoldBlank(blank) {
      if (!blank) return;
      resetBlankEditable(blank);
      syncUsedChipsFromBlanks();
      persistScaffold();
      renderChips();
      save();
    }

    function placeChipOnBlank(word, blank) {
      if (!blank || !word) return false;
      // Replacing an existing chip fill is allowed
      setBlankAsChip(blank, word);
      state.lastBlankTarget = blank;
      clearChipSelection();
      syncUsedChipsFromBlanks();
      persistScaffold();
      renderChips();
      save();
      return true;
    }

    function decorateRestoredBlank(blank, text) {
      const t = (text || '').trim();
      if (!t) {
        resetBlankEditable(blank);
        return;
      }
      if (vocabWordList().includes(t)) {
        setBlankAsChip(blank, t);
      } else {
        blank.classList.remove('filled');
        blank.removeAttribute('data-chip-word');
        blank.contentEditable = 'true';
        blank.textContent = t;
      }
    }

    function bindVocabChip(btn) {
      const word = btn.getAttribute('data-word');
      btn.setAttribute('draggable', 'true');
      btn.addEventListener('dragstart', (e) => {
        // Prefer pointer-based drag (iPad-friendly); cancel native HTML5 DnD.
        e.preventDefault();
      });
      btn.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (chipPointer) return;
        chipPointer = {
          word,
          btn,
          startX: e.clientX,
          startY: e.clientY,
          dragging: false,
          pointerId: e.pointerId,
          ghost: null
        };
        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      });
      btn.addEventListener('pointermove', (e) => {
        if (!chipPointer || chipPointer.pointerId !== e.pointerId) return;
        const dx = e.clientX - chipPointer.startX;
        const dy = e.clientY - chipPointer.startY;
        if (!chipPointer.dragging && Math.hypot(dx, dy) > 8) {
          chipPointer.dragging = true;
          clearChipSelection();
          btn.classList.add('dragging');
          chipPointer.ghost = createChipGhost(word, e.clientX, e.clientY);
        }
        if (chipPointer.dragging && chipPointer.ghost) {
          chipPointer.ghost.style.left = e.clientX + 'px';
          chipPointer.ghost.style.top = e.clientY + 'px';
          highlightBlankUnder(e.clientX, e.clientY);
        }
      });
      const endPointer = (e) => {
        if (!chipPointer || chipPointer.pointerId !== e.pointerId) return;
        const wasDragging = chipPointer.dragging;
        const w = chipPointer.word;
        const b = chipPointer.btn;
        if (wasDragging) {
          const target = blankFromPoint(e.clientX, e.clientY);
          if (target) placeChipOnBlank(w, target);
          else toast('請拖到句式空格上');
        } else {
          // Tap: select / deselect — does NOT auto-paste into next blank
          if (state.selectedChipWord === w) clearChipSelection();
          else setChipSelection(w, b);
        }
        try { b.releasePointerCapture(e.pointerId); } catch (_) {}
        b.classList.remove('dragging');
        removeChipGhost();
        chipPointer = null;
      };
      btn.addEventListener('pointerup', endPointer);
      btn.addEventListener('pointercancel', endPointer);
      // Block legacy click-to-paste
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    }

    function bindScaffoldBlank(blank) {
      blank.addEventListener('focus', () => { state.lastBlankTarget = blank; });
      blank.addEventListener('input', () => {
        // Manual typing — not a chip fill
        if (blank.getAttribute('data-chip-word')) {
          blank.removeAttribute('data-chip-word');
          blank.classList.remove('filled');
          const clr = blank.querySelector('.blank-clear');
          if (clr) clr.remove();
          syncUsedChipsFromBlanks();
          renderChips();
        }
        persistScaffold();
      });
      blank.addEventListener('blur', persistScaffold);

      blank.addEventListener('pointerdown', (e) => {
        // If a vocab chip is selected, place it on this blank (two-step iPad fallback)
        if (state.selectedChipWord) {
          e.preventDefault();
          placeChipOnBlank(state.selectedChipWord, blank);
          return;
        }
        // Tap filled chip-blank again to clear (× also works)
        if (blank.classList.contains('filled') && blank.getAttribute('data-chip-word')) {
          if (e.target && e.target.classList && e.target.classList.contains('blank-clear')) return;
          e.preventDefault();
          clearScaffoldBlank(blank);
        }
      });
    }

    function renderChips() {
      const vocab = VOCAB[state.ks];
      const used = state.usedChips[answerKey('chips')] || {};
      const mk = (arr, hostId) => {
        const host = document.getElementById(hostId);
        if (!host) return;
        host.innerHTML = arr.map(w => {
          const sel = state.selectedChipWord === w ? 'selected' : '';
          return `<button type="button" class="chip ${used[w] ? 'used' : ''} ${sel}" data-word="${escapeHtml(w)}" draggable="true">${escapeHtml(w)}</button>`;
        }).join('');
        host.querySelectorAll('.chip').forEach(bindVocabChip);
      };
      mk(vocab.elements, 'chips-elements');
      mk(vocab.principles, 'chips-principles');
    }

    /** Idea bank / peer helpers: insert into focused blank or textarea (not used by vocab chips). */
    function insertChip(word) {
      const blank = state.lastBlankTarget && document.body.contains(state.lastBlankTarget)
        ? state.lastBlankTarget
        : document.querySelector('#step-content .scaffold-blank:not(.filled)') ||
          document.querySelector('#step-content .scaffold-blank');
      if (blank) {
        // Free-text / idea paste into blank
        blank.classList.remove('filled');
        blank.removeAttribute('data-chip-word');
        blank.contentEditable = 'true';
        const existing = blankPlainText(blank);
        blank.textContent = existing ? existing + word : word;
        if (!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) {
          blank.focus({ preventScroll: true });
        }
        persistScaffold();
      } else {
        const ta = document.querySelector('#step-content textarea');
        if (ta) {
          const start = ta.selectionStart || ta.value.length;
          const end = ta.selectionEnd || ta.value.length;
          ta.value = ta.value.slice(0, start) + word + ta.value.slice(end);
          if (!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) {
            ta.focus({ preventScroll: true });
          }
          ta.selectionStart = ta.selectionEnd = start + word.length;
          persistOpenText();
        } else {
          toast('請先點選句式空格或書寫區');
          return;
        }
      }
      markWordUsed(word);
      renderChips();
      save();
    }

    function persistScaffold() {
      const blanks = [...document.querySelectorAll('#step-content .scaffold-blank')];
      state.answers[answerKey('scaffold')] = blanks.map(b => blankPlainText(b));
      save();
    }

    function persistOpenText() {
      const ta = document.querySelector('#step-content textarea');
      if (ta) {
        state.answers[answerKey('open')] = ta.value;
        save();
      }
    }

    function renderStepContent() {
      const panel = document.getElementById('step-content');
      const step = STEPS[state.step];
      const isKS1 = state.ks === 'ks1';
      const useScaffold = isKS1 || state.level === 1;

    /** 把 data URL 壓成 JPEG（最大寬 1600、quality 0.7）；失敗則回傳原文 */
    function compressDataUrl(dataUrl, maxW, quality) {
      return new Promise((resolve) => {
        if (!dataUrl || typeof dataUrl !== 'string' || dataUrl.indexOf('data:') !== 0) {
          resolve(null);
          return;
        }
        const img = new Image();
        img.onload = () => {
          try {
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (!w || !h) { resolve(dataUrl); return; }
            const limit = maxW || 1600;
            if (w > limit) {
              h = Math.round(h * (limit / w));
              w = limit;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality != null ? quality : 0.7));
          } catch (e) {
            resolve(dataUrl);
          }
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    /** 彙整五步評賞文字（給 submission.json 的 steps） */
    function buildStepsPayload() {
      const prevStep = state.step;
      const out = {};
      STEPS.forEach((st, i) => {
        state.step = i;
        const useScaffold = state.ks === 'ks1' || state.level === 1;
        const entry = { id: st.id, title: st.title };
        if (state.ks === 'ks1' && i === 0) {
          entry.mood = state.moods[answerKey('mood')] || '';
        }
        if (useScaffold) {
          entry.scaffold = (state.answers[answerKey('scaffold')] || []).slice();
          entry.text = entry.scaffold.filter(Boolean).join('／');
        } else {
          entry.open = state.answers[answerKey('open')] || '';
          entry.text = entry.open;
          entry.rubric = state.rubrics[answerKey('rubric')] || {};
        }
        out[st.id] = entry;
      });
      state.step = prevStep;
      return out;
    }

    async function submitToCloud() {
      if (!SUBMIT_URL) {
        toast('請先在「雲端設定」貼上學校 /exec 網址');
        openCloudSettings();
        return;
      }
      if (!state.className) {
        toast('請先選擇班別');
        return;
      }
      if (!state.studentId && !state.studentName) {
        toast('請先選擇學生');
        return;
      }

      const btn = document.getElementById('btn-cloud-submit');
      if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }

      try {
        let imageBase64 = null;
        let imageMime = null;
        if (state.selfImage) {
          const compressed = await compressDataUrl(state.selfImage, 1600, 0.7);
          imageBase64 = compressed || state.selfImage;
          imageMime = 'image/jpeg';
        }

        const payload = {
          action: 'submit',
          className: state.className,
          studentName: state.studentName,
          studentId: state.studentId,
          ks: state.ks,
          level: state.level,
          source: state.source,
          unit: UNIT_TITLE,
          steps: buildStepsPayload(),
          pins: state.pins,
          answers: state.answers,
          moods: state.moods,
          rubrics: state.rubrics
        };
        if (imageBase64) {
          payload.imageBase64 = imageBase64;
          payload.imageMime = imageMime;
        }

        // 勿加自訂 Authorization 等標頭，以免 Apps Script CORS 失敗
        const res = await fetch(SUBMIT_URL, {
          method: 'POST',
          // text/plain 可避過部分 preflight；Apps Script 仍可 JSON.parse
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch (e) { /* ignore */ }

        if (!res.ok && !data) {
          throw new Error('伺服器回應 ' + res.status);
        }
        if (!data || !data.ok) {
          throw new Error((data && data.error) || '提交失敗');
        }

        save(); // 本機仍保留
        const link = data.folderUrl || data.fileUrl || '';
        if (link) {
          toast(
            '已提交到學校雲端！ <a href="' + link.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">開啟資料夾</a>',
            { html: true, duration: 8000 }
          );
        } else {
          toast('已提交到學校雲端！', { duration: 4000 });
        }
        if (data.warning) toast(data.warning, { duration: 5000 });
      } catch (err) {
        toast('提交失敗：' + (err && err.message ? err.message : String(err)), { duration: 4500 });
      } finally {
        if (btn) {
          btn.textContent = '提交到學校雲端';
          refreshSubmitButton();
        }
      }
    }

    document.getElementById('pin-pop-del').addEventListener('click', () => {
      if (!popoverPin) return;
      state.pins = state.pins.filter(p => p.id !== popoverPin.id);
      closePinPopover();
      renderPinList();
      save();
    });
    document.getElementById('pin-pop-close').addEventListener('click', closePinPopover);

    // seed default pins for master on first visit
    load();
    if (!localStorage.getItem(STORAGE_KEY)) {
      state.pins = [
        { id: 'seed1', scope: 'master:main', x: 42, y: 28, note: '高聳樓群——密度與垂直線' },
        { id: 'seed2', scope: 'master:main', x: 55, y: 72, note: '水面／港灣——柔和橫向節奏' },
        { id: 'seed3', scope: 'master:main', x: 78, y: 35, note: '遠景山影——空間層次' }
      ];
    }
    renderAll();
    syncAppHeaderHeight();
    requestAnimationFrame(syncAppHeaderHeight);
    save();
    loadRoster();

    // Firebase anon auth once; rejoin saved classroom session if any
    initFirebaseOnce().then((ok) => {
      if (!ok) return;
      if (gallerySession) {
        const input = document.getElementById('gallery-session-input');
        if (input) input.value = gallerySession;
        startGalleryListener(gallerySession);
      }
    });
  })();
  </script>
</body>
</html>
