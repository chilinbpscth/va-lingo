<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>跟小蓮看一次｜藝言堂・時間膠囊拼貼自評示範</title>
<link rel="stylesheet" href="../guided/style.css"><link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="demo-banner">示範練習・只存於這部裝置・不會交給老師</div>
<header class="site-header"><a class="brand" href="../../"><img class="school-crest" src="../guided/school-crest.png" alt="佛教志蓮小學校徽"><span class="brand-words"><small>佛教志蓮小學</small><span>藝言堂・時間膠囊</span></span></a><span class="brand-note">小二・拼貼自評</span><a class="back-link" href="../../">返回藝言堂・時間膠囊</a></header>
<main class="demo-shell"><nav id="progress" aria-label="示範進度"></nav><p id="save-status" role="status"></p><div id="demo-app"></div></main>
<footer class="site-footer"><span>先看一次，再說出自己的發現。</span><span>教學設計示例・非學生真實作品</span></footer>
<dialog id="review" aria-labelledby="review-title"><div class="dialog-head"><h2 id="review-title">回看示範</h2><button id="close-review">返回我的回答</button></div><div id="review-body"></div></dialog>
<dialog id="reset" aria-labelledby="reset-title"><h2 id="reset-title">重新試一次？</h2><p>會清除這次示範練習的小貓和回答。藝言堂・時間膠囊正式筆記不受影響。</p><div class="actions"><button id="cancel-reset">保留練習</button><button id="confirm-reset" class="primary">清除並重新開始</button></div></dialog>
<script src="demo.js"></script>
</body></html>
